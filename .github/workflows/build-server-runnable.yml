name: Build NanoSmart Runnable Server

on:
  push:
    branches: [boton-vida-640]

permissions:
  contents: write

jobs:
  build-server:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boton-vida-640
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and verify startup
        working-directory: server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor
        shell: bash
        run: |
          npm ci --omit=dev
          node -e "require('qrcode'); require('./src/pairing')"
          node --check server.js
          npm test
          node server.js > server-startup-test.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/api/health >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat server-startup-test.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          rm -f server-startup-test.log

      - name: Package runnable server
        shell: bash
        run: |
          mkdir -p deliverables
          rm -f deliverables/NanoSmart_Server_v3.6_BotonVida640_LISTO.zip
          (cd server-src && zip -qr ../deliverables/NanoSmart_Server_v3.6_BotonVida640_LISTO.zip NanoSmartServer_Windows_v3.6_Rendimiento_Receptor -x '*/data/*' '*/secrets/*')
          printf '%s\n' "Server runnable OK $(date -u +%Y-%m-%dT%H:%M:%SZ)" > deliverables/SERVER_BUILD_OK.txt

      - name: Commit runnable server
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deliverables/NanoSmart_Server_v3.6_BotonVida640_LISTO.zip deliverables/SERVER_BUILD_OK.txt
          git commit -m "Build runnable NanoSmart Botón Vida server" || true
          git push origin HEAD:boton-vida-640
