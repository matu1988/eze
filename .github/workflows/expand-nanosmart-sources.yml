name: Expand NanoSmart sources

on:
  push:
    branches:
      - boton-vida-640

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-src server-src
          unzip -q -o NanoSmartEventos_v32_Rendimiento_Source.zip -d android-src
          unzip -q -o NanoSmartServer_Windows_v3.6_Rendimiento_Receptor.zip -d server-src

      - name: Commit expanded sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- android-src server-src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Expand NanoSmart app and server sources"
          git push origin HEAD:boton-vida-640
