name: Implement Boton Vida server

on:
  push:
    branches: [boton-vida-640]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[life-server-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        shell: python
        run: |
          from pathlib import Path

          root = Path('server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor')
          server = root / 'server.js'
          protocol = root / 'src/protocol.js'
          registry = root / 'src/registry.js'

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(protocol,
              "  '608': { description: 'Test automático con falla', category: 'TEST', subjectKind: 'ZONA' }\n",
              "  '608': { description: 'Test automático con falla', category: 'TEST', subjectKind: 'ZONA' },\n  '640': { description: 'Botón Vida', category: 'ALARMA', subjectKind: 'USUARIO' }\n")

          replace_once(protocol,
              "    ...(forwarding.eventCodes || ['100', '110', '120']),\n    ...requiredBurglaryEventCodes\n",
              "    ...(forwarding.eventCodes || ['100', '110', '120', '640']),\n    ...requiredBurglaryEventCodes,\n    '640'\n")

          replace_once(server,
              "  INCENDIO: Object.freeze({ eventCode: '110', description: 'Incendio' })\n",
              "  INCENDIO: Object.freeze({ eventCode: '110', description: 'Incendio' }),\n  VIDA: Object.freeze({ eventCode: '640', description: 'Botón Vida' })\n")

          replace_once(server,
              "      ...(parsed.protocol.appForwarding.eventCodes || ['100', '110', '120']),\n      ...requiredBurglaryEventCodes\n",
              "      ...(parsed.protocol.appForwarding.eventCodes || ['100', '110', '120', '640']),\n      ...requiredBurglaryEventCodes,\n      '640'\n")

          replace_once(server,
              "      'El tipo de emergencia debe ser MEDICA, PANICO o INCENDIO',\n",
              "      'El tipo de emergencia debe ser MEDICA, PANICO, INCENDIO o VIDA',\n")

          replace_once(server,
              "function appendAppEmergency(installation, body, req) {\n",
              "function normalizeLifeRequestId(value) {\n  const requestId = String(value || '').trim();\n  if (!/^[A-Za-z0-9._:-]{8,120}$/.test(requestId)) {\n    throw new RegistryError('requestId inválido para Botón Vida', 400, 'INVALID_LIFE_REQUEST_ID');\n  }\n  return requestId;\n}\n\nfunction existingLifeRequest(installation, body) {\n  if (String(body.type || '').trim().toUpperCase() !== 'VIDA') return null;\n  const requestId = normalizeLifeRequestId(body.requestId);\n  return store.getEvents({ take: 5000, imei: installation.imei })\n    .find((event) => event.eventCode === '640' && event.requestId === requestId) || null;\n}\n\nfunction appendAppEmergency(installation, body, req) {\n")

          replace_once(server,
              "  const receivedAt = new Date().toISOString();\n  const location = emergencyLocation(body, receivedAt);\n",
              "  const receivedAt = new Date().toISOString();\n  const location = emergencyLocation(body, receivedAt);\n  const requestId = emergencyType === 'VIDA' ? normalizeLifeRequestId(body.requestId) : null;\n  const buttonId = emergencyType === 'VIDA'\n    ? String(body.buttonId || '').trim().slice(0, 160) || null\n    : null;\n  const buttonBattery = emergencyType === 'VIDA' && Number.isFinite(Number(body.buttonBattery))\n    ? Math.max(0, Math.min(100, Math.round(Number(body.buttonBattery))))\n    : null;\n")

          replace_once(server,
              "    actorInstallationId: installation.installationId,\n    ...location\n",
              "    actorInstallationId: installation.installationId,\n    requestId,\n    buttonId,\n    buttonBattery,\n    ...location\n")

          replace_once(server,
              "    mapsUrl: mapsUrl(event.latitude, event.longitude)\n",
              "    mapsUrl: mapsUrl(event.latitude, event.longitude),\n    requestId: event.requestId || null,\n    buttonId: event.buttonId || null,\n    buttonBattery: Number.isFinite(event.buttonBattery) ? event.buttonBattery : null\n")

          replace_once(server,
              "    if (req.method === 'POST' && pathname === '/api/app/register') {\n      const body = await readJsonBody(req);\n      json(res, 201, registry.registerInstallation(body));\n      return;\n    }\n",
              "    if (req.method === 'POST' && pathname === '/api/app/register') {\n      const body = await readJsonBody(req);\n      json(res, 201, registry.registerInstallation(body));\n      return;\n    }\n\n    if (req.method === 'POST' && pathname === '/api/app/life/register') {\n      const body = await readJsonBody(req);\n      json(res, 201, registry.registerLifeInstallation(body));\n      return;\n    }\n")

          replace_once(server,
              "      if (req.method === 'POST' && pathname === '/api/app/emergency') {\n        const body = await readJsonBody(req);\n        const currentInstallation = body.name\n",
              "      if (req.method === 'POST' && pathname === '/api/app/emergency') {\n        const body = await readJsonBody(req);\n        const existing = existingLifeRequest(installation, body);\n        if (existing) {\n          json(res, 200, { alert: compactAppAlert(existing), duplicate: true });\n          return;\n        }\n        const currentInstallation = body.name\n")

          replace_once(registry,
              "  provisionMobilePairings(imeiValue, labelsValue = null, options = {}) {\n",
              "  registerLifeInstallation(input = {}) {\n    const imei = validateImei(input.imei);\n    const pairingSlot = this.#findPairingSlot(imei, input.accessKey);\n    if (pairingSlot) {\n      pairingSlot.lastUsedAt = new Date().toISOString();\n      this.#save();\n    } else {\n      this.verifyAccessKey(imei, input.accessKey);\n    }\n    const deviceIdentifier = String(input.deviceIdentifier || '').trim().slice(0, 160);\n    if (!deviceIdentifier) {\n      throw new RegistryError('Falta la identificación del Botón Vida', 400, 'MISSING_LIFE_DEVICE_ID');\n    }\n    const suffix = crypto.createHash('sha256')\n      .update(`${imei}\\u0000${deviceIdentifier}`)\n      .digest('hex')\n      .slice(0, 32);\n    return this.#createInstallation(imei, {\n      ...input,\n      installationId: `life:${suffix}`,\n      name: input.name || `Botón Vida ${imei.slice(-4)}`,\n      purpose: 'LIFE_BUTTON',\n      pushToken: null\n    });\n  }\n\n  provisionMobilePairings(imeiValue, labelsValue = null, options = {}) {\n")

          replace_once(registry,
              "    const platform = normalizePlatform(input.platform, previous?.platform || 'ANDROID');\n\n    this.#unindexInstallation(previous);\n",
              "    const platform = normalizePlatform(input.platform, previous?.platform || 'ANDROID');\n    const purpose = String(input.purpose || previous?.purpose || 'MOBILE').trim().toUpperCase();\n\n    this.#unindexInstallation(previous);\n")

          replace_once(registry,
              "      platform,\n      enabled: true,\n",
              "      platform,\n      purpose,\n      enabled: true,\n")

          replace_once(registry,
              "      platform,\n      accessToken,\n      tokenType: 'Bearer',\n",
              "      platform,\n      purpose,\n      accessToken,\n      tokenType: 'Bearer',\n")

          replace_once(registry,
              "      .filter((item) => item?.enabled && item.pushToken)\n",
              "      .filter((item) => item?.enabled && item.pushToken && item.purpose !== 'LIFE_BUTTON')\n")

          replace_once(registry,
              "      platform: installation.platform || 'ANDROID',\n      enabled: installation.enabled,\n",
              "      platform: installation.platform || 'ANDROID',\n      purpose: installation.purpose || 'MOBILE',\n      enabled: installation.enabled,\n")

          test_path = root / 'test/life-button.test.js'
          test_path.write_text(r'''\
'use strict';

const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const os = require('node:os');
const path = require('node:path');
const { DeviceRegistry } = require('../src/registry');
const { parseContactId, shouldForwardContactEvent } = require('../src/protocol');

test('Contact ID 640 se reconoce como Botón Vida y se reenvía a la app', () => {
  const contact = parseContactId('1234181640010000');
  assert.equal(contact.eventCode, '640');
  assert.equal(contact.eventDescription, 'Botón Vida');
  assert.equal(contact.subjectKind, 'USUARIO');
  assert.equal(shouldForwardContactEvent(contact, { appForwarding: { enabled: true, qualifiers: ['1'] } }), true);
});

test('credencial Botón Vida no reemplaza la instalación móvil ni recibe push', () => {
  const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'nanosmart-life-registry-'));
  try {
    const registry = new DeviceRegistry(path.join(dir, 'registry.json'));
    registry.initialize();
    const provision = registry.provisionDevice('869671077527867');
    const mobile = registry.registerInstallation({
      imei: provision.imei,
      accessKey: provision.accessKey,
      name: 'Celular principal',
      pushToken: 'push-main'
    });
    const life = registry.registerLifeInstallation({
      imei: provision.imei,
      accessKey: provision.accessKey,
      name: 'Persona mayor',
      deviceIdentifier: 'AA:BB:CC:DD:EE:FF'
    });
    assert.notEqual(life.installationId, mobile.installationId);
    assert.notEqual(life.accessToken, mobile.accessToken);
    assert.equal(life.purpose, 'LIFE_BUTTON');
    assert.equal(registry.authenticate(mobile.accessToken).installationId, mobile.installationId);
    assert.deepEqual(registry.listPushTargets(provision.imei).map(x => x.pushToken), ['push-main']);
  } finally {
    fs.rmSync(dir, { recursive: true, force: true });
  }
});
'''.lstrip(), encoding='utf-8')

      - name: Test server
        working-directory: server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor
        run: npm test

      - name: Commit generated server changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor/server.js \
            server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor/src/protocol.js \
            server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor/src/registry.js \
            server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor/test/life-button.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[life-server-generated] Implement Botón Vida event 640"
          git push origin HEAD:boton-vida-640
