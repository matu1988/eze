name: Trace Generic Event Injector

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump event generation helpers
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          d=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          B=0x08000000
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          def dump(s,e,title):
              print(f'\n===== {title} {B+s:08X}-{B+e:08X} =====')
              for i in md.disasm(d[s:e],B+s):
                  print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          dump(0x8120,0x8350,'0x8178 / 0x82A8 event helpers')
          dump(0x8BC0,0x8D60,'Packet00 generator details')
          dump(0x3B10,0x3BA0,'main loop before generic 3031 injection')
          dump(0x9E40,0x9F90,'second Packet00 path exact alignment')
          PY
