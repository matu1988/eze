name: Trace Packet00 Duplicate State

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trace appended state machine
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          import struct

          base=0x08000000
          data=Path('MA_196-GE-AR_PACKET00_IP1_IP2_FIX_V2.bin').read_bytes()
          md=Cs(CS_ARCH_ARM, CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          md.detail=True

          start=0x10B3E; end=0x10D40
          print('=== APPENDED CODE ===')
          insns=list(md.disasm(data[start:end],base+start))
          for insn in insns:
              extra=''
              # annotate 16-bit literal LDRs
              if len(insn.bytes)==2:
                  hw=int.from_bytes(insn.bytes,'little')
                  if (hw & 0xF800)==0x4800:
                      imm=hw&0xFF
                      lit=((insn.address+4)&~3)+(imm<<2)
                      off=lit-base
                      if 0<=off<=len(data)-4:
                          val=struct.unpack_from('<I',data,off)[0]
                          extra=f' ; [0x{lit:08X}] = 0x{val:08X}'
              print(f'{insn.address:08X}: {insn.bytes.hex(" "):14} {insn.mnemonic:8} {insn.op_str}{extra}')

          print('\n=== LITERAL POOL 0x10D40-END ===')
          for off in range(0x10D40,len(data)-3,4):
              v=struct.unpack_from('<I',data,off)[0]
              if v!=0:
                  kind=''
                  if 0x08000000<=v<0x08100000: kind='FLASH'
                  elif 0x20000000<=v<0x20010000: kind='RAM'
                  print(f'0x{off:05X}: 0x{v:08X} {kind}')

          print('\n=== HOOK CALLERS ===')
          targets=range(0x8010B3E,0x8010D40,2)
          # Scan all BL/B.W instructions via capstone from known code starts is hard; just report known hook sites and target disassembly.
          for off in [0x3B0C,0x3BE8,0x7AFC,0x7D5C,0x7D60,0x7D78,0x9736,0x9740,0x977A,0x97C0,0xDC56]:
              print(f'-- hook site 0x{off:X} --')
              for insn in md.disasm(data[off:off+8],base+off):
                  print(f'{insn.address:08X}: {insn.bytes.hex(" "):14} {insn.mnemonic:8} {insn.op_str}')
          PY
