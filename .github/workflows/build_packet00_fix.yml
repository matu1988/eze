name: Analyze MA193 GPRS Socket Mapping

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove socket zero maps IP PORT and socket one maps IP2 PORT2
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000; d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          def dis(s,e): return list(md.disasm(d[s:e],B+s))
          def dump(s,e,title):
              print('\n### '+title)
              for i in dis(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
          def u32(a): return struct.unpack_from('<I',d,a-B)[0]
          def cstr(a,n=100):
              o=a-B; out=[]
              if not 0<=o<len(d): return None
              for x in d[o:o+n]:
                  if x==0: break
                  if not 32<=x<=126:return None
                  out.append(chr(x))
              return ''.join(out) if out else None
          def lits(s,e):
              for i in dis(s,e):
                  if i.mnemonic.startswith('ldr') and '[pc' in i.op_str:
                      m=re.search(r'\[pc(?:, #?(0x[0-9a-f]+|\d+))?\]',i.op_str.lower())
                      if m:
                          im=int(m.group(1),0) if m.group(1) else 0; la=((i.address+4)&~3)+im
                          if B<=la<=B+len(d)-4:
                              v=u32(la); print(f'LIT {i.address:08X} @{la:08X}={v:08X}',repr(cstr(v)))

          dump(0xA180,0xA2B0,'GPRS SOCKET OPEN CONFIG')
          lits(0xA180,0xA2B0)
          dump(0xB330,0xB3C0,'GPRS SOCKET OPEN HELPER B358')
          lits(0xB330,0xB3C0)

          # exact refs to selector table and nearby contexts
          addr=0x20003D82; pat=struct.pack('<I',addr); pos=0; refs=[]
          while True:
              q=d.find(pat,pos)
              if q<0: break
              refs.append(B+q); pos=q+1
          print('\nSELECTOR_TABLE_REFS',[f'{x:08X}' for x in refs])
          for r in refs: dump(max(0,r-B-28),min(len(d),r-B+24),f'REF {r:08X}')

          # startup RAM zeroing ranges: dump reset init functions around calls to memset and RAM end literals
          dump(0x3900,0x3C20,'MAIN STARTUP AROUND INIT')
          lits(0x3900,0x3C20)

          print('\nSELECTOR_ADDR',hex(addr))
          PY
