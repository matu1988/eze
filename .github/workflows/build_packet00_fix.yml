name: Analyze MA193 IP Parameters

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace IP PORT IP2 PORT2 consumers
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          def insns(s,e): return list(md.disasm(d[s:e],B+s))
          def dump(s,e,title):
              print('\n### '+title)
              for i in insns(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')

          allins=insns(0x100,len(d))
          # Locate 0x7B4C config lookup calls and infer r0 immediate from preceding instructions.
          print('### CONFIG LOOKUP CALLS FOR IDS 16..19')
          for idx,i in enumerate(allins):
              if i.mnemonic=='bl' and i.op_str.lower().replace('#','')==hex(0x08007B4C):
                  prev=allins[max(0,idx-8):idx]
                  idv=None
                  for p in reversed(prev):
                      if p.mnemonic in ('movs','mov') and p.op_str.startswith('r0,'):
                          op=p.op_str.split(',',1)[1].strip().replace('#','')
                          try: idv=int(op,0)
                          except: pass
                          break
                  if idv in (16,17,18,19):
                      print(f'call={i.address:08X} id={idv}')
                      off=i.address-B
                      dump(max(0,off-36),min(len(d),off+64),f'PARAM {idv} CONTEXT')

          # Direct raw refs to key/default strings.
          print('\n### POINTER REFS TO IP KEYS / DEFAULTS')
          items={
              'IP_key':0x0800F61B,'PORT_key':0x0800F64F,'IP2_key':0x0800F61E,'PORT2_key':0x0800F654,
              'default_ip_a':0x0800F593,'default_ip_b':0x0800F5A2,'default_port':0x0800F5B1,
              'sendudp1':0x0800FC87,'sendudp3':0x0800FC91,
          }
          for name,addr in items.items():
              pat=struct.pack('<I',addr); refs=[]; p=0
              while True:
                  q=d.find(pat,p)
                  if q<0: break
                  refs.append(B+q); p=q+1
              print(name,hex(addr),[f'{x:08X}' for x in refs])

          print('\n### EXACT BYTES/STRINGS AROUND B4EC CHOICE')
          for off in range(0xFCA0,0xFCB8):
              print(f'{B+off:08X}: {d[off]:02X} {chr(d[off]) if 32<=d[off]<=126 else "."}')

          dump(0xB4EC,0xB500,'B4EC CHOICE')
          dump(0xDC48,0xDDA0,'PACKET FORMATTER DC48 COMPLETE')

          # Find immediate call contexts around transport/network setup functions where keys 16-19 are likely used.
          # Also show every reference to table addresses 0xF474..0xF480.
          print('\n### TABLE ENTRY ADDRESS REFS (F474..F480)')
          for addr in (0x0800F474,0x0800F478,0x0800F47C,0x0800F480):
              pat=struct.pack('<I',addr); refs=[]; p=0
              while True:
                  q=d.find(pat,p)
                  if q<0: break
                  refs.append(B+q); p=q+1
              print(f'{addr:08X}: {[f"{x:08X}" for x in refs]}')
          PY
