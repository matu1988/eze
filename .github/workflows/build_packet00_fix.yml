name: Trace Event Cleanup Valid Entry

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trace cleanup
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          import struct

          base=0x08000000
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          md.detail=True

          for tag,fn in [('ORIG','MA_193-GE-AR.bin'),('MOD','MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin'),('V2','MA_196-GE-AR_PACKET00_IP1_IP2_FIX_V2.bin')]:
              data=Path(fn).read_bytes()
              print(f'\n===== {tag} event loop from 0x9704 =====')
              for insn in md.disasm(data[0x9704:0x9850],base+0x9704):
                  print(f'{insn.address:08X}: {insn.bytes.hex(" "):14} {insn.mnemonic:8} {insn.op_str}')

          # Dump the event generator function from exact valid entry 0x8CE0 and nearby called timer function 0x3E0C.
          data=Path('MA_193-GE-AR.bin').read_bytes()
          for name,start,end in [('generator_8CE0',0x8CE0,0x8D5C),('timer_3E0C',0x3E0C,0x3EB0),('event_8178',0x8178,0x8220)]:
              print(f'\n===== {name} =====')
              for insn in md.disasm(data[start:end],base+start):
                  print(f'{insn.address:08X}: {insn.bytes.hex(" "):14} {insn.mnemonic:8} {insn.op_str}')

          # Hex around 0x97B0-0x9800 for exact comparison.
          print('\n===== HEX DIFFERENCE 0x97A0-0x9800 =====')
          for tag,fn in [('ORIG','MA_193-GE-AR.bin'),('MOD','MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin'),('V2','MA_196-GE-AR_PACKET00_IP1_IP2_FIX_V2.bin')]:
              data=Path(fn).read_bytes()
              print(tag, data[0x97A0:0x9800].hex(' '))
          PY
