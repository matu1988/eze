name: Build TEST4 Dynamic ME Network Map

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild golden TEST4 and remap network by current ME
        shell: bash
        run: |
          python -m pip install --quiet capstone keystone-engine
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from keystone import Ks,KS_ARCH_ARM,KS_MODE_THUMB,KS_MODE_LITTLE_ENDIAN
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN

          B=0x08000000
          src=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          assert len(src)==69096
          assert hashlib.sha256(src).hexdigest()=='c12fdc4a58fe4a1cfa13f8de3981ac267039d8ca72c292e9ec8245bbb1a31f76'
          ks=Ks(KS_ARCH_ARM,KS_MODE_THUMB|KS_MODE_LITTLE_ENDIAN)
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          def asm(s,a):
              enc,_=ks.asm(s,addr=a); return bytes(enc)

          # Rebuild exact hardware-validated TEST4 first.
          out=bytearray(src)
          tfix=B+len(out)
          code=asm('''
              ldrh r2, [r0, #0x1a]
              movw r3, #0x3030
              cmp r2, r3
              ite eq
              moveq r3, #1
              movne r3, #0
              adds r4, #0x16
              b.w 0x080097c4
          ''',tfix)
          out.extend(code)
          while len(out)%4: out.append(0)
          routefix=B+len(out)
          code=asm('''
              mov r0, r4
              ldrh r1, [r0, #4]
              movw r2, #0x3030
              cmp r1, r2
              bne not_packet00
              ldrb r3, [r0, #2]
              movw r2, #0x3d82
              movt r2, #0x2000
              movs r1, #0
              strb r1, [r2, r3]
              bl 0x0800b4e0
              pop {r4, pc}
          not_packet00:
              bx lr
          ''',routefix)
          out.extend(code)
          while len(out)%4: out.append(0)
          out[0x10d04:0x10d08]=asm(f'b.w 0x{tfix:08x}',B+0x10d04)
          out[0x10dd4:0x10dd8]=asm(f'b.w 0x{routefix:08x}',B+0x10dd4)
          assert len(out)==69152
          assert hashlib.sha256(out).hexdigest()=='7df8498e95e73df5a89f2a1d8989257bbcf279157e63e50ea73075482bc2d91b'
          golden=bytes(out)

          # IMPORTANT: keep ME key/default/storage and all switching logic untouched.
          assert out[0x10b24:0x10b29]==b'ME\x001\x00'
          me_bytes_before=bytes(out[0x10b24:0x10b54])

          # Existing IP/PORT default helper entry points are already called from
          # the native config getters at 0x7D5C/0x7D60. Replace only those helper
          # bodies with branches to larger dynamic helpers appended below.
          # Inputs: r0 = config ID (16=IP1,18=IP2; 17=PORT1,19=PORT2).
          # Current ME is read by existing safe helper 0x08010B3E.
          iphelper=B+len(out)
          ipcode=asm('''
              push {r4, lr}
              mov r4, r0
              bl 0x08010b3e
              cmp r0, #0
              beq me0
              cmp r0, #1
              beq me1
              b me2
          me0:
              cmp r4, #0x10
              beq orig_ip1
              b orig_ip2
          me1:
              cmp r4, #0x10
              beq orig_ip2
              b new_ip
          me2:
              b new_ip
          orig_ip1:
              movw r0, #0xf593
              movt r0, #0x0800
              pop {r4, pc}
          orig_ip2:
              movw r0, #0xf5a2
              movt r0, #0x0800
              pop {r4, pc}
          new_ip:
              movw r0, #0x0b29
              movt r0, #0x0801
              pop {r4, pc}
          ''',iphelper)
          out.extend(ipcode)
          while len(out)%4: out.append(0)

          porthelper=B+len(out)
          portcode=asm('''
              push {r4, lr}
              mov r4, r0
              bl 0x08010b3e
              cmp r0, #0
              beq orig_port
              cmp r0, #1
              beq me1
              b new_port
          me1:
              cmp r4, #0x11
              beq orig_port
              b new_port
          orig_port:
              movw r0, #0xf5b1
              movt r0, #0x0800
              pop {r4, pc}
          new_port:
              movw r0, #0x0b38
              movt r0, #0x0801
              pop {r4, pc}
          ''',porthelper)
          out.extend(portcode)
          while len(out)%4: out.append(0)

          # Only redirect the already-existing helper entry points.
          out[0x10b96:0x10b9a]=asm(f'b.w 0x{iphelper:08x}',B+0x10b96)
          out[0x10ba6:0x10baa]=asm(f'b.w 0x{porthelper:08x}',B+0x10ba6)

          # Guards: ME storage/default and all event/TREG/IMEI logic are unchanged.
          assert bytes(out[0x10b24:0x10b54])==me_bytes_before
          assert out[0x96cc:0x9812]==golden[0x96cc:0x9812]
          assert out[0x10ccc:0x10d04]==golden[0x10ccc:0x10d04]
          assert out[0x10dc4:0x10dd4]==golden[0x10dc4:0x10dd4]
          assert out[0x10de8:0x10e20]==golden[0x10de8:0x10e20]
          assert out[0x3be8:0x3bec]==golden[0x3be8:0x3bec]
          assert out[0x3b0c:0x3b10]==golden[0x3b0c:0x3b10]

          # Verify the two redirects decode correctly.
          for off,target in [(0x10b96,iphelper),(0x10ba6,porthelper)]:
              ins=list(md.disasm(bytes(out[off:off+4]),B+off))[0]
              print(hex(B+off),ins.mnemonic,ins.op_str,'target',hex(target))
              assert ins.mnemonic=='b.w'

          print('IPHELPER',hex(iphelper),'LEN',len(ipcode))
          for i in md.disasm(ipcode,iphelper): print(f'{i.address:08X}: {i.mnemonic:8} {i.op_str}')
          print('PORTHELPER',hex(porthelper),'LEN',len(portcode))
          for i in md.disasm(portcode,porthelper): print(f'{i.address:08X}: {i.mnemonic:8} {i.op_str}')

          name='MA_196-GE-AR_TEST4_ME_DYNAMIC_NETWORK_FINAL.bin'
          Path(name).write_bytes(out)
          print('OUT_SIZE',len(out))
          print('OUT_SHA256',hashlib.sha256(out).hexdigest())
          print('ME0 IP1=177.71.166.146:20000 IP2=24.232.246.134:20000')
          print('ME1 IP1=24.232.246.134:20000 IP2=54.232.115.106:7050')
          print('ME2 IP1=54.232.115.106:7050 IP2=54.232.115.106:7050')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MA196_TEST4_ME_DYNAMIC_NETWORK_FINAL
          path: MA_196-GE-AR_TEST4_ME_DYNAMIC_NETWORK_FINAL.bin
          if-no-files-found: error
