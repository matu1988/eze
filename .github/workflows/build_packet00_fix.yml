name: Analyze MA193 Event Lifecycle

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace status field, queue lifecycle and timer reset causes
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          def dis(s,e): return list(md.disasm(d[s:e],B+s))
          def dump_addr(addr,pre=28,post=44,title=''):
              off=addr-B; s=max(0,(off-pre)&~1); e=min(len(d),off+post)
              print('\n### '+(title or f'CTX {addr:08X}'))
              for i in dis(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          def dump(s,e,title):
              print('\n### '+title)
              for i in dis(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          allins=dis(0x100,len(d))

          print('### ALL MEMORY ACCESSES WITH +0x18 IN COMMUNICATION / EVENT CORE')
          hits=[]
          for i in allins:
              if 0x08007E00 <= i.address <= 0x0800A100 and '#0x18]' in i.op_str.lower():
                  hits.append(i.address)
                  print(f'{i.address:08X}: {i.mnemonic:9} {i.op_str}')
          for a in hits: dump_addr(a,30,50,f'+0x18 ACCESS {a:08X}')

          print('\n### ALL DIRECT STORES TO +0x18 ANYWHERE')
          sh=[]
          for i in allins:
              op=i.op_str.lower()
              if i.mnemonic.startswith('str') and '#0x18]' in op:
                  sh.append(i.address); print(f'{i.address:08X}: {i.mnemonic:9} {i.op_str}')
          for a in sh: dump_addr(a,36,52,f'+0x18 STORE {a:08X}')

          print('\n### CALLERS 0x08009148')
          calls=[]
          for i in allins:
              if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(0x08009148): calls.append(i.address)
          print([f'{x:08X}' for x in calls])
          for a in calls: dump_addr(a,18,24,f'CALL 9148 @ {a:08X}')
          dump(0x90F0,0x9190,'FUNCTION 0x08009148 + NEIGHBORS')

          print('\n### CALLERS 0x08008DEC')
          calls=[]
          for i in allins:
              if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(0x08008DEC): calls.append(i.address)
          print([f'{x:08X}' for x in calls])
          for a in calls: dump_addr(a,22,30,f'CALL 8DEC @ {a:08X}')
          dump(0x8DC0,0x8E70,'FUNCTION 0x08008DEC FULL')

          print('\n### CALLERS / BODY OF 0x08007FD4 (EVENT RESET)')
          calls=[]
          for i in allins:
              if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(0x08007FD4): calls.append(i.address)
          print([f'{x:08X}' for x in calls])
          for a in calls: dump_addr(a,18,24,f'CALL 7FD4 @ {a:08X}')
          dump(0x7F80,0x8048,'FUNCTION 0x08007FD4 FULL')

          # Event structure builders/copy/reset candidates around 0x8A00-0x91xx.
          dump(0x8A00,0x8CE0,'EVENT CHANNEL / SELECTOR HELPERS BEFORE PACKET00')
          dump(0x8F40,0x90F0,'EVENT CHANNEL STATE FUNCTIONS BEFORE 9148')

          # Show all accesses to A +0x48 and B +0x3c and status +0x39 in state machine cores.
          print('\n### TIMER / STATUS FIELD ACCESSES A+B')
          for i in allins:
              if 0x08009300 <= i.address <= 0x0800A000:
                  op=i.op_str.lower()
                  if any(k in op for k in ('#0x48]','#0x3c]','#0x39]','#0x38]')):
                      print(f'{i.address:08X}: {i.mnemonic:9} {i.op_str}')
          PY
