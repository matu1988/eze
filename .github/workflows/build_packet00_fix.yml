name: Trace IP Destination Wrappers

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace wrappers
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          import struct
          B=0x08000000
          d=Path('MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          for s,e in [(0x10B20,0x10C30),(0x10C80,0x10D10)]:
            print(f'\nREGION {B+s:08X}-{B+e:08X}')
            for i in md.disasm(d[s:e],B+s):
              print(f'{i.address:08X}: {i.bytes.hex(" "):12} {i.mnemonic:8} {i.op_str}')
          print('\nLITERALS 10D40-10DC4')
          for off in range(0x10D40,0x10DC4,4):
            if off+4<=len(d): print(f'{B+off:08X}: {struct.unpack_from("<I",d,off)[0]:08X}')
          PY
