name: Inspect ME Network Helpers

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode complete ME network helper and literals
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          for s,e in [(0x10b3e,0x10c22),(0x10d20,0x10da0)]:
              print(f'\nDISASM {s:05x}-{e:05x}')
              for i in md.disasm(d[s:e],B+s):
                  print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          print('\nWORDS 10d20-10da0')
          for off in range(0x10d20,0x10da0,4):
              print(hex(B+off), hex(struct.unpack_from('<I',d,off)[0]))
          print('\nBYTES 10b20-10b40',d[0x10b20:0x10b40].hex(' '))
          PY
