name: Analyze MA193 Dual Server Lifecycle

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode GPRS and LAN dual-server event lifecycle
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          def dis(s,e): return list(md.disasm(d[s:e],B+s))
          def dump(s,e,title):
              print('\n### '+title)
              for i in dis(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')

          dump(0x96CC,0x9820,'GPRS STATE MACHINE A ALL STATES')
          dump(0x9E24,0x9FA8,'LAN STATE MACHINE B ALL STATES')
          dump(0xA850,0xA940,'GPRS SEND A8A8')
          dump(0xB4C0,0xB500,'GPRS SERVER SELECTOR B4C8/B4E0')

          print('\n### REAL STRB/STORE ACCESSES TO B OBJECT +0x4D')
          seen=set()
          for off in range(0x9300,0xA100,2):
              xs=list(md.disasm(d[off:off+4],B+off,1))
              if not xs: continue
              i=xs[0]
              if i.address in seen: continue
              op=i.op_str.lower()
              if i.mnemonic.startswith(('strb','ldrb')) and '#0x4d]' in op:
                  seen.add(i.address)
                  print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
                  o=i.address-B;dump(max(0,o-20),min(len(d),o+36),f'B+4D ACCESS {i.address:08X}')

          # Also find stores to offset +0x4c..+0x4f in B object neighborhood to catch wide encodings.
          print('\n### B OBJECT NEAR DESTINATION FIELDS 4C-4F')
          for off in range(0x9300,0xA100,2):
              xs=list(md.disasm(d[off:off+4],B+off,1))
              if not xs:continue
              i=xs[0];op=i.op_str.lower()
              if i.mnemonic.startswith(('str','ldr')) and any(f'#0x{x:x}]' in op for x in range(0x4c,0x50)):
                  print(f'{i.address:08X}: {i.mnemonic:9} {i.op_str}')

          # Calls to BB08 and BBFC with contexts show how selector changes across states.
          allins=dis(0x100,len(d))
          for t in (0x0800BB08,0x0800BBFC,0x0800B4C8,0x0800B4E0,0x0800A8A8):
              hs=[i.address for i in allins if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(t)]
              print(f'\nCALLERS {t:08X}: {[f"{x:08X}" for x in hs]}')
              for a in hs:
                  o=a-B;dump(max(0,o-24),min(len(d),o+36),f'CALL {a:08X}->{t:08X}')
          PY
