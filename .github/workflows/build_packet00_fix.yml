name: Verify Free RAM For TREG

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RAM neighborhood
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          from capstone.arm import ARM_OP_MEM, ARM_REG_PC
          import struct
          B=0x08000000
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.detail=True
          for fn in ['MA_193-GE-AR.bin','MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin']:
              d=Path(fn).read_bytes()
              print('\n###',fn)
              for s,e in [(0xC4D0,0xC550),(0x10C20,min(len(d),0x10E20))]:
                  if s>=len(d): continue
                  print(f'-- {B+s:08X}-{B+e:08X}')
                  for i in md.disasm(d[s:e],B+s):
                      print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
              print('literal refs exact:')
              for a in [0x200043A4,0x200043A8,0x200043AC,0x200043B0,0x200043B4,0x200043B8,0x200043BC]:
                  raw=struct.pack('<I',a); ps=[]; p=0
                  while True:
                      p=d.find(raw,p)
                      if p<0: break
                      ps.append(p); p+=1
                  print(hex(a),[hex(x) for x in ps])
          PY
