name: Diagnose MA193 TEST1 Startup Freeze

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare image tails and executable append layout
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import hashlib,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          names=[
            'MA_193-GE-AR.bin',
            'MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin',
            'MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin',
            'MA_196-GE-AR_PACKET00_SOLO_IP1_TREG_LIVELOOP_V3.bin',
          ]
          files={n:Path(n).read_bytes() for n in names if Path(n).exists()}
          for n,d in files.items():
            print('\n###',n)
            print('size',len(d),'end',hex(B+len(d)),'sha256',hashlib.sha256(d).hexdigest())
            print('last96',d[-96:].hex(' '))
          o=files['MA_193-GE-AR.bin']
          tail=o[-64:]
          print('\nORIGINAL_LAST64_LOCATIONS')
          for n,d in files.items():
            p=0; hits=[]
            while True:
              q=d.find(tail,p)
              if q<0:break
              hits.append(q);p=q+1
            print(n,hits)
          # Search a shorter distinctive trailer signature from original.
          sig=o[-8:]
          print('ORIGINAL_LAST8',sig.hex(' '))
          for n,d in files.items():
            hits=[];p=0
            while True:
              q=d.find(sig,p)
              if q<0:break
              hits.append(q);p=q+1
            print('last8 hits',n,hits)

          # Verify TEST1 helper logic register assumptions against full state machine.
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          print('\n### STATE3 ENTRY / EVENT FIELD REFERENCES')
          for i in md.disasm(o[0x96cc:0x9812],B+0x96cc):
            if 0x080097b0 <= i.address <= 0x080097dc or i.address in (0x080096d0,0x08009758):
              print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
          print('\n### RESET VECTOR / VECTOR TABLE')
          for off in range(0,0x40,4):
            print(hex(off),hex(struct.unpack_from('<I',o,off)[0]))
          PY
