name: Diagnose TREG Packet00 Timer

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate TREG and timer logic
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          import struct

          files = [
              'MA_193-GE-AR.bin',
              'MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin',
              'MA_196-GE-AR_PACKET00_IP1_IP2_FIX_V2.bin',
          ]
          base = 0x08000000
          md = Cs(CS_ARCH_ARM, CS_MODE_THUMB | CS_MODE_LITTLE_ENDIAN)

          for fn in files:
              data = Path(fn).read_bytes()
              print('\n================', fn, '================')
              for needle in [b'TREG', b'00', b'EVENT', b'TIMER-IHM']:
                  positions=[]
                  p=0
                  while True:
                      i=data.find(needle,p)
                      if i<0: break
                      positions.append(i); p=i+1
                  print(needle, [hex(x) for x in positions[:20]])

              treg = data.find(b'TREG')
              if treg >= 0:
                  addr = base+treg
                  ptr = struct.pack('<I', addr)
                  refs=[]
                  p=0
                  while True:
                      i=data.find(ptr,p)
                      if i<0: break
                      refs.append(i); p=i+1
                  print('TREG addr', hex(addr), 'literal refs', [hex(x) for x in refs])
                  for r in refs:
                      s=max(0,r-0x100); e=min(len(data),r+0x80)
                      print(f'-- disasm around literal ref offset 0x{r:X} --')
                      for insn in md.disasm(data[s:e], base+s):
                          if abs(insn.address-(base+r)) < 0x100:
                              print(f'{insn.address:08X}: {insn.bytes.hex(" "):12} {insn.mnemonic:8} {insn.op_str}')

              # Search common timer constants: 60s, 1min ticks, 20min, 24h in ms/sec.
              vals=[60,60000,1200,1200000,86400,86400000]
              for v in vals:
                  raw=struct.pack('<I',v)
                  hits=[i for i in range(len(data)-3) if data[i:i+4]==raw]
                  if hits:
                      print('const',v,'hits', [hex(x) for x in hits[:20]])
          PY
