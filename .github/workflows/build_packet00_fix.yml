name: Build Packet00 Dual IP TREG V3

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V3
        shell: bash
        run: |
          python -m pip install --quiet keystone-engine capstone
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from keystone import Ks, KS_ARCH_ARM, KS_MODE_THUMB, KS_MODE_LITTLE_ENDIAN
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN

          src = Path('MA_196-GE-AR_PACKET00_IP1_IP2_FIX_V2.bin')
          dst = Path('MA_196-GE-AR_PACKET00_IP1_IP2_TREG_FIX_V3.bin')
          data = bytearray(src.read_bytes())

          expected_sha = '358b7c613432abe4e10384921b2ff90546b655f8ac0f140a818861facfc2374a'
          got_sha = hashlib.sha256(data).hexdigest()
          assert got_sha == expected_sha, f'Unexpected V2 SHA256: {got_sha}'
          assert len(data) == 69076
          assert len(data) == 0x10DD4
          assert bytes(data[0x97C0:0x97C4]) == bytes.fromhex('07 F0 84 FA')

          base = 0x08000000
          helper_off = len(data)
          helper_addr = base + helper_off

          asm = r'''
              push {r0, lr}
              bl 0x08010B3E
              mov ip, r0
              pop.w {r0, lr}
              cmp.w ip, #1
              bne cleanup

              ldrh r1, [r4, #0x1a]
              movw r2, #0x5063
              cmp r1, r2
              beq cleanup

              movw r2, #0x43ac
              movt r2, #0x2000
              ldr r3, [r2]
              cbnz r3, second_pass

              movs r3, #1
              str r3, [r2]
              movw r2, #0x3ce4
              movt r2, #0x2000
              strb r3, [r2]
              movw r2, #0x3cf0
              movt r2, #0x2000
              movs r3, #0
              strb r3, [r2]
              pop {r3, r4, r5, r6, r7, pc}

          second_pass:
              movs r3, #0
              str r3, [r2]
              movw r2, #0x3030
              cmp r1, r2
              bne resume
              str r3, [r0, #0x48]

          resume:
              ldrb r3, [r0, #0x18]
              adds r4, #0x16
              movw r2, #0x97c5
              movt r2, #0x0800
              bx r2

          cleanup:
              movw r2, #0x43ac
              movt r2, #0x2000
              movs r1, #0
              str r1, [r2]
              ldrb r3, [r0, #0x18]
              adds r4, #0x16
              movw r2, #0x97c5
              movt r2, #0x0800
              bx r2
          '''

          ks = Ks(KS_ARCH_ARM, KS_MODE_THUMB | KS_MODE_LITTLE_ENDIAN)
          enc, _ = ks.asm(asm, addr=helper_addr)
          helper = bytes(enc)
          assert helper, 'Helper assembly empty'

          # Redirect the existing 0x97C0 hook to the new V3 helper.
          bl_enc, _ = ks.asm(f'bl 0x{helper_addr:08X}', addr=base + 0x97C0)
          bl = bytes(bl_enc)
          assert len(bl) == 4, bl.hex()
          data[0x97C0:0x97C4] = bl

          # Append the new helper. All V2 bytes other than the BL target remain unchanged.
          data.extend(helper)
          dst.write_bytes(data)

          # Integrity checks.
          check = dst.read_bytes()
          assert check[:0x97C0] == src.read_bytes()[:0x97C0]
          assert check[0x97C4:0x10DD4] == src.read_bytes()[0x97C4:0x10DD4]
          assert check[0x10DD4:] == helper

          md = Cs(CS_ARCH_ARM, CS_MODE_THUMB | CS_MODE_LITTLE_ENDIAN)
          site = list(md.disasm(check[0x97C0:0x97C4], base+0x97C0))
          assert len(site) == 1 and site[0].mnemonic == 'bl'
          assert int(site[0].op_str.lstrip('#'), 16) == helper_addr

          # Confirm the V3 helper contains the TREG rearm store at [r0,#0x48].
          dis = list(md.disasm(helper, helper_addr))
          assert any(i.mnemonic == 'str' and '[r0, #0x48]' in i.op_str for i in dis)

          print('Created:', dst)
          print('Base V2 SHA256:', expected_sha)
          print(f'New helper: 0x{helper_addr:08X}, {len(helper)} bytes')
          print('Patched 0x080097C0:', bl.hex(' '), site[0].mnemonic, site[0].op_str)
          print('New size:', len(check))
          print('V3 SHA256:', hashlib.sha256(check).hexdigest())
          print('\nV3 helper disassembly:')
          for i in dis:
              print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          PY

      - name: Upload V3
        uses: actions/upload-artifact@v4
        with:
          name: MA_196_PACKET00_IP1_IP2_TREG_FIX_V3
          path: MA_196-GE-AR_PACKET00_IP1_IP2_TREG_FIX_V3.bin
          if-no-files-found: error

      - name: Commit V3
        shell: bash
        run: |
          git config user.name "packet00-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add MA_196-GE-AR_PACKET00_IP1_IP2_TREG_FIX_V3.bin
          if git diff --cached --quiet; then
            echo "V3 already present"
          else
            git commit -m "Add Packet00 dual IP TREG rearm V3"
            git push
          fi
