name: Analyze MA193 From Scratch

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static analysis MA193
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, struct
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN

          B=0x08000000
          p=Path('MA_193-GE-AR.bin')
          d=p.read_bytes()
          print('=== FILE ===')
          print('size', len(d))
          print('sha256', hashlib.sha256(d).hexdigest())
          if len(d)>=8:
              print('initial_sp', hex(struct.unpack_from('<I',d,0)[0]))
              print('reset_vector', hex(struct.unpack_from('<I',d,4)[0]))

          print('\n=== ASCII STRINGS >=4 ===')
          for m in re.finditer(rb'[ -~]{4,}', d):
              s=m.group().decode('ascii','replace')
              if any(k in s.upper() for k in ['TREG','IMEI','IP','PORT','AB','TEST','TST','ME','SERVER','HOST','RESET','PACK','GPRS','UDP']):
                  print(f'{m.start():06X} {B+m.start():08X} {s}')

          def find_bytes(blob):
              out=[]; pos=0
              while True:
                  i=d.find(blob,pos)
                  if i<0: break
                  out.append(i); pos=i+1
              return out

          print('\n=== CONSTANT OCCURRENCES ===')
          consts={
              '3030_halfword': bytes.fromhex('30 30'),
              '5063_halfword': bytes.fromhex('63 50'),
              'TREG_ascii': b'TREG',
              'ME_ascii': b'ME',
              'IMEI_ascii': b'IMEI',
          }
          for name,blob in consts.items():
              arr=find_bytes(blob)
              print(name, [f'0x{x:X}' for x in arr])

          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          md.detail=False
          def dump(s,e,title):
              s=max(0,s&~1); e=min(len(d),e)
              print(f'\n=== {title} 0x{B+s:08X}-0x{B+e:08X} ===')
              for i in md.disasm(d[s:e],B+s):
                  print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')

          # Dump around each 3030/5063 constant occurrence where interpreting as code may reveal construction paths.
          for off in find_bytes(bytes.fromhex('30 30')):
              dump(off-80, off+96, f'around raw 3030 @ file+0x{off:X}')
          for off in find_bytes(bytes.fromhex('63 50')):
              dump(off-80, off+96, f'around raw 5063 @ file+0x{off:X}')

          # Known regions from later binary are inspected only as reference points, without assuming equivalence.
          for s,e,title in [
              (0x3D40,0x3E40,'timer clock/deadline candidate'),
              (0x72E0,0x7660,'configuration/TREG candidate'),
              (0x8080,0x8F40,'event construction/generator candidate'),
              (0x9000,0xA020,'event state machines candidate'),
              (0xB300,0xB620,'route/transport candidate'),
              (0xC000,0xC620,'configuration parser candidate'),
          ]:
              if s < len(d): dump(s,e,title)

          # Compare original prefix against modified 196 only to identify historical patch locations; 193 remains source of truth.
          q=Path('MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin')
          if q.exists():
              e=q.read_bytes()
              n=min(len(d),len(e))
              ranges=[]; start=None
              for i in range(n):
                  if d[i]!=e[i] and start is None: start=i
                  elif d[i]==e[i] and start is not None:
                      ranges.append((start,i)); start=None
              if start is not None: ranges.append((start,n))
              print('\n=== FORENSIC DIFF 193 vs old modified 196 (prefix only) ===')
              print('196_size',len(e),'196_sha256',hashlib.sha256(e).hexdigest())
              print('different_ranges_count',len(ranges))
              for a,b in ranges[:200]:
                  print(f'0x{a:05X}-0x{b-1:05X} len={b-a} 193={d[a:b].hex(" ")} 196={e[a:b].hex(" ")}')

          PY
