name: Trace ME Default and Network Getters

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode ME and default network helper paths
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          for s,e,name in [
             (0x79e0,0x7b20,'CONFIG GETTERS 79E0-7B20'),
             (0x7d30,0x7df0,'DEFAULT STRING GETTERS 7D30-7DF0'),
             (0x10b24,0x10bc0,'APPENDED ME/NETWORK HELPERS'),
          ]:
              print('\n###',name)
              for i in md.disasm(d[s:e],B+s):
                  print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          print('\nDATA 10B24-10B90',d[0x10b24:0x10b90].hex(' '))
          print('ASCII segments')
          import re
          for m in re.finditer(rb'[ -~]{2,}',d[0x10b24:0x10b90]): print(hex(0x10b24+m.start()),repr(m.group().decode()))
          # Find all literal refs to 0x0800F526 and nearby candidate bytes/halfwords.
          for val in [B+0xf526,B+0xf524,B+0xf528,0xf526,0x02,0x00]:
              if val>0xff:
                  pat=struct.pack('<I',val); hits=[];p=0
                  while True:
                      q=d.find(pat,p)
                      if q<0:break
                      hits.append(hex(B+q));p=q+1
                  print('REF',hex(val),hits)
          # print nearby pointer table entries and interpret as little-endian words
          print('\nWORDS F480-F540')
          for off in range(0xf480,0xf540,4):
              v=struct.unpack_from('<I',d,off)[0]
              print(hex(B+off),hex(v))
          # Search references to appended "ME" key address 0x8010b24
          pat=struct.pack('<I',B+0x10b24); hits=[];p=0
          while True:
              q=d.find(pat,p)
              if q<0:break
              hits.append(hex(B+q));p=q+1
          print('REFS_ME_KEY',hits)
          PY
