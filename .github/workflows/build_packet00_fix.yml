name: Analyze MA193 Event Buffer Semantics

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map event buffer layout, channel values and native TREG reset
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          def dis(s,e): return list(md.disasm(d[s:e],B+s))
          def dump(s,e,title):
              print('\n### '+title)
              for i in dis(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
          allins=dis(0x100,len(d))

          dump(0x80F0,0x8320,'EVENT CONSTRUCTOR 8178 + GENERIC INJECTOR 82A8')
          dump(0x8A00,0x8C80,'EVENT CHANNEL HELPERS')
          dump(0x8CE0,0x8D58,'PACKET00 GENERATOR')

          print('\n### ALL CALLS TO GENERIC INJECTOR 0x080082A8 WITH PRECEDING ARGUMENT SETUP')
          calls=[i.address for i in allins if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(0x080082A8)]
          print([f'{x:08X}' for x in calls])
          for a in calls:
              off=a-B; dump(max(0,off-34),min(len(d),off+18),f'82A8 CALL {a:08X}')

          print('\n### ALL CALLS TO NATIVE CONSTRUCTOR 0x08008178')
          calls=[i.address for i in allins if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(0x08008178)]
          print([f'{x:08X}' for x in calls])
          for a in calls:
              off=a-B; dump(max(0,off-34),min(len(d),off+18),f'8178 CALL {a:08X}')

          # Search robustly from each aligned halfword for single instructions that write byte offset 2 or load event code offsets 4/6.
          print('\n### SINGLE-INSTRUCTION SCAN FOR EVENT BUFFER BYTE +2 WRITES')
          seen=set()
          for off in range(0x7000,min(len(d),0xE500),2):
              xs=list(md.disasm(d[off:off+4],B+off,1))
              if not xs: continue
              i=xs[0]; op=i.op_str.lower()
              if i.mnemonic.startswith('strb') and ('#2]' in op or '#0x2]' in op):
                  key=(i.address,i.bytes)
                  if key not in seen:
                      seen.add(key); print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')

          print('\n### STATE3 BUFFER RELATION PROOF')
          dump(0x96CC,0x97DC,'A FROM OBJECT BASE TO EVENT BUFFER/TIMER RESET')
          dump(0x9E24,0x9F48,'B FROM OBJECT BASE TO EVENT BUFFER/TIMER RESET')

          # Identify event code loads in send/routing/formatter paths. We expect code near event+4.
          print('\n### HALFWORD LOADS NEAR EVENT BUFFER USERS')
          for s,e,name in [(0x96CC,0x9810,'A'),(0x9E24,0x9F80,'B'),(0xB470,0xB530,'selector'),(0xDBB0,0xDC80,'formatter')]:
              print('##',name)
              for i in dis(s,e):
                  if i.mnemonic.startswith('ldrh') or i.mnemonic.startswith('strh'):
                      print(f'{i.address:08X}: {i.mnemonic:9} {i.op_str}')
          PY
