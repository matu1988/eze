name: Analyze MA193 GPRS Failover Semantics

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify state2 failover and packet00 safe routing plan
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000; d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          def dis(s,e): return list(md.disasm(d[s:e],B+s))
          def dump(s,e,title):
              print('\n### '+title)
              for i in dis(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
          def u32(a): return struct.unpack_from('<I',d,a-B)[0]
          def cstr(a,n=120):
              o=a-B; out=[]
              if not 0<=o<len(d): return None
              for x in d[o:o+n]:
                  if x==0: break
                  if not 32<=x<=126:return None
                  out.append(chr(x))
              return ''.join(out) if out else None
          def lits(s,e):
              for i in dis(s,e):
                  if i.mnemonic.startswith('ldr') and '[pc' in i.op_str:
                      m=re.search(r'\[pc(?:, #?(0x[0-9a-f]+|\d+))?\]',i.op_str.lower())
                      if not m: continue
                      im=int(m.group(1),0) if m.group(1) else 0; la=((i.address+4)&~3)+im
                      if B<=la<=B+len(d)-4:
                          v=u32(la); print(f'LIT {i.address:08X} @{la:08X}={v:08X}',repr(cstr(v)))

          dump(0xAE70,0xAFA0,'AEC0 ACK/RESPONSE HELPER AREA')
          lits(0xAE70,0xAFA0)
          dump(0xB400,0xB4C8,'GPRS RESPONSE PARSER / SEND STATUS')
          lits(0xB400,0xB4C8)
          dump(0x96CC,0x9812,'FULL GPRS EVENT STATE MACHINE')

          # Search calls to selector toggle and response helper only.
          allins=dis(0x100,len(d))
          for t in (0x0800AEC0,0x0800B4C8,0x0800B4E0,0x08008DEC):
              hs=[i.address for i in allins if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(t)]
              print(f'CALLERS {t:08X}',[f'{x:08X}' for x in hs])

          # Confirm code locations to patch: route selector fetch, post-send skip, TREG reset.
          print('\nPATCH_BYTES_ROUTE',d[0x9730:0x973A].hex(' '))
          print('PATCH_BYTES_POSTSEND',d[0x9754:0x9766].hex(' '))
          print('PATCH_BYTES_TREG',d[0x97C0:0x97D2].hex(' '))
          PY
