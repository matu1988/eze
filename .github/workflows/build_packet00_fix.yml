name: Map MA193 Default Network and ME Configuration

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate ME IP PORT IP2 PORT2 defaults
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import re,struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          files=['MA_193-GE-AR.bin','MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin']
          for fn in files:
              d=Path(fn).read_bytes()
              print('\n###',fn,'SIZE',len(d))
              # all IP-like ASCII strings and port-looking strings
              for m in re.finditer(rb'(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])',d):
                  print('IPSTR',hex(m.start()),hex(B+m.start()),m.group().decode())
              for needle in [b'20000',b'7050',b'177.71.166.146',b'24.232.246.134',b'54.232.115.106',b'ME',b'IP2',b'PORT2',b'PORT',b'TREG']:
                  p=0;hits=[]
                  while True:
                      q=d.find(needle,p)
                      if q<0:break
                      hits.append((hex(q),hex(B+q)))
                      p=q+1
                  print('HITS',needle,hits)
              # printable strings around config data region
              print('\nASCII 0xF300-0xF800')
              for m in re.finditer(rb'[ -~]{2,}',d[0xf300:0xf800]):
                  s=m.group().decode(errors='replace')
                  print(hex(0xf300+m.start()),repr(s))
              print('\nHEX 0xF430-0xF550')
              for off in range(0xf430,0xf550,16):
                  print(f'{off:05x}:',d[off:off+16].hex(' '))
              # references to known IP string addresses and nearby defaults
              for ip in [b'177.71.166.146',b'24.232.246.134']:
                  q=d.find(ip)
                  if q>=0:
                      addr=B+q
                      pat=struct.pack('<I',addr)
                      refs=[];p=0
                      while True:
                          x=d.find(pat,p)
                          if x<0:break
                          refs.append(hex(B+x));p=x+1
                      print('REFS_TO',ip.decode(),hex(addr),refs)
          PY
