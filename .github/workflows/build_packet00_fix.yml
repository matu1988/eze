name: Diagnose Packet00 Routing

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disassemble routing hook
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN

          files = [
              'MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin',
              'MA_196-GE-AR_PACKET00_IP1_IP2_FIX.bin',
          ]
          start = 0x10C70
          end = 0x10D40
          base_addr = 0x08000000
          md = Cs(CS_ARCH_ARM, CS_MODE_THUMB | CS_MODE_LITTLE_ENDIAN)
          md.detail = True

          for fn in files:
              data = Path(fn).read_bytes()
              print('\n====', fn, '====')
              chunk = data[start:end]
              for insn in md.disasm(chunk, base_addr + start):
                  print(f'{insn.address:08X}: {insn.bytes.hex(" "):12} {insn.mnemonic:8} {insn.op_str}')
          PY
