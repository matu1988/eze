name: Analyze MA193 Final Native Map

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close native LAN routing and inspect old additions only forensically
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import hashlib,struct,re
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          p=Path('MA_193-GE-AR.bin'); d=p.read_bytes()
          m=Path('MA_196-GE-AR_ME1_PACKET00_AB_IMEI60S_IP2_RESET24H_TEST.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          def dis(buf,s,e): return list(md.disasm(buf[s:e],B+s))
          def dump(buf,s,e,title):
              print('\n### '+title)
              for i in dis(buf,s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
          def u32(buf,addr): return struct.unpack_from('<I',buf,addr-B)[0]
          all193=dis(d,0x100,len(d))

          print('### LAN SELECTOR INITIALIZER B894 + CALLERS')
          dump(d,0xB830,0xB8C0,'B7C4/B8xx LAN INITIALIZATION')
          for t in (0x0800B7C4,0x0800B894,0x0800BDA8):
              hs=[i.address for i in all193 if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(t)]
              print(f'{t:08X} callers={[f"{x:08X}" for x in hs]}')
              for a in hs:
                  o=a-B;dump(d,max(0,o-20),min(len(d),o+30),f'CALLER {a:08X}')

          # decode functions surrounding B894 to infer selector values / IP parameters
          dump(d,0xB7C0,0xB940,'LAN NETWORK CONFIG OBJECT SETUP')
          dump(d,0xBAC0,0xBD40,'LAN SENDUDP1/2/3 FAMILY')

          print('\n### 193 5063 OCCURRENCES + CONTEXT')
          for off in range(0,len(d)-2):
              if d[off:off+2]==bytes.fromhex('63 50'):
                  print(f'raw {B+off:08X}')
                  dump(d,max(0,(off-36)&~1),min(len(d),off+52),f'5063 CTX {B+off:08X}')

          print('\n### OLD196 APPENDED AREA (FORENSIC ONLY)')
          print('193_size',len(d),'old196_size',len(m),'old196_sha',hashlib.sha256(m).hexdigest())
          if len(m)>len(d): dump(m,len(d)&~1,len(m),'APPENDED OLD196 CODE/DATA')

          # compact diff ranges only in original 193 address space
          print('\n### OLD196 PATCH RANGES INSIDE ORIGINAL 193 (FORENSIC ONLY)')
          ranges=[];st=None
          for i in range(len(d)):
              diff=d[i]!=m[i]
              if diff and st is None: st=i
              if not diff and st is not None:
                  ranges.append((st,i));st=None
          if st is not None:ranges.append((st,len(d)))
          for a,b in ranges:
              if b-a<=24:
                  print(f'{B+a:08X}-{B+b-1:08X} len={b-a} 193={d[a:b].hex(" ")} 196={m[a:b].hex(" ")}')
              else:
                  print(f'{B+a:08X}-{B+b-1:08X} len={b-a}')

          # Search old196 appended disassembly for key calls/constants: 5063, 3030, 60 sec, 86400 sec, get config ids 16-19.
          print('\n### OLD196 APPENDED KEY INSTRUCTIONS')
          for i in dis(m,len(d)&~1,len(m)):
              txt=(i.mnemonic+' '+i.op_str).lower()
              if any(k in txt for k in ('0x5063','0x3030','0x15180','0x3c','0x10','#0x12','#0x13')) or i.op_str.lower().replace('#','') in (hex(0x08003e0c),hex(0x080082a8),hex(0x08010b3e)):
                  print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:9} {i.op_str}')
          PY
