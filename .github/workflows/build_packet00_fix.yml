name: Analyze MA193 Routing State

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map native routes and Packet00 side effects
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct,re
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_193-GE-AR.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          def insns(s,e): return list(md.disasm(d[s:e],B+s))
          def dump(s,e,title):
              print('\n### '+title)
              for i in insns(s,e): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          def u32(off): return struct.unpack_from('<I',d,off)[0]
          def astr(off,maxlen=80):
              if not (0<=off<len(d)): return None
              out=[]
              for b in d[off:off+maxlen]:
                  if b==0: break
                  if b<32 or b>126: return None
                  out.append(chr(b))
              return ''.join(out) if out else None

          print('### CONFIG/NETWORK STRINGS')
          for m in re.finditer(rb'[ -~]{3,}',d):
              off=m.start(); s=m.group().decode('ascii','replace')
              if 0xE000 <= off <= 0x10500 and len(s)<=80:
                  print(f'{B+off:08X}: {s}')
          print('\n### DOTTED/IP-LIKE STRINGS')
          for m in re.finditer(rb'(?:\d{1,3}\.){3}\d{1,3}',d):
              print(f'{B+m.start():08X}: {m.group().decode()}')

          print('\n### POINTER TABLE AROUND TREG REFERENCE')
          for off in range(0xF400,0xF4C0,4):
              v=u32(off)
              s=astr(v-B) if B<=v<B+len(d) else None
              print(f'{B+off:08X}: {v:08X}'+(f' -> {s}' if s else ''))

          dump(0x8D5C,0x8DF0,'PACKET00 RELATED HELPERS AFTER GENERATOR')
          dump(0x96CC,0x9820,'STATE MACHINE A COMPLETE')
          dump(0x9E24,0x9F40,'STATE MACHINE B COMPLETE')
          dump(0xA860,0xA9C0,'TRANSPORT/ROUTE FUNCTION 0x0800A8A8')
          dump(0xBAD0,0xBC20,'TRANSPORT FUNCTION 0x0800BB08')
          dump(0xBD40,0xBE30,'STATE/TRANSPORT FUNCTION 0x0800BD78')
          dump(0xB4C8,0xB500,'SELECTOR FUNCTIONS B4C8/B4E0')
          dump(0xDBB0,0xDCA0,'PACKET TYPE 3030/5063 SPECIAL HANDLING')

          print('\n### SELECTOR LITERALS')
          for off in (0xB4DC,0xB4E8,0xB4F8,0xB4FC):
              if off+4<=len(d): print(f'{B+off:08X}: {u32(off):08X}')

          print('\n### FUNCTION CALLERS')
          allins=insns(0x100,len(d))
          for t in (0x0800A8A8,0x0800BB08,0x0800BD78,0x0800B4C8,0x0800B4E0,0x08008D5C,0x08008D88):
              hits=[]
              for i in allins:
                  if i.mnemonic in ('bl','blx') and i.op_str.lower().replace('#','')==hex(t): hits.append(i.address)
              print(f'{t:08X}: {[f"{x:08X}" for x in hits]}')

          # Decode literal pools used by A and B state machines as raw words.
          for start,end,title in [(0x9810,0x9840,'A literal pool'),(0x9F88,0x9FC0,'B literal pool'),(0xA980,0xA9C0,'A8A8 literal pool'),(0xBC00,0xBC30,'BB08 literal pool'),(0xBE00,0xBE30,'BD78 literal pool')]:
              print('\n### '+title)
              for off in range(start,end,4):
                  if off+4<=len(d):
                      v=u32(off); s=astr(v-B) if B<=v<B+len(d) else None
                      print(f'{B+off:08X}: {v:08X}'+(f' -> {s}' if s else ''))
          PY
