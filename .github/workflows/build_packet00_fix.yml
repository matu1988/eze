name: Build MA196 Combined Safe TEST4

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build combined known-booting routing plus safe TREG fix
        shell: bash
        run: |
          python -m pip install --quiet capstone keystone-engine
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          from keystone import Ks,KS_ARCH_ARM,KS_MODE_THUMB,KS_MODE_LITTLE_ENDIAN

          B=0x08000000
          src=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          assert len(src)==69096, len(src)
          assert hashlib.sha256(src).hexdigest()=='c12fdc4a58fe4a1cfa13f8de3981ac267039d8ca72c292e9ec8245bbb1a31f76'

          # Known-booting MA196 routing base invariants.
          assert src[0x97c0:0x97c4] == bytes.fromhex('07 f0 84 fa')   # BL 0x08010CCC
          assert src[0x10d04:0x10d08] == bytes.fromhex('03 7e 16 34') # ldrb r3,[r0,#18]; adds r4,#16
          assert src[0x10dd4:0x10de8] == bytes.fromhex('20 46 81 88 43 f2 30 02 91 42 02 d1 fa f7 7e fb 10 bd 70 47')
          assert src[0x10dc4:0x10dd4] == bytes.fromhex('45 f2 63 02 91 42 02 d0 43 f2 30 02 91 42 70 47')

          ks=Ks(KS_ARCH_ARM,KS_MODE_THUMB|KS_MODE_LITTLE_ENDIAN)
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN); md.skipdata=True
          def asm(code,addr):
              enc,_=ks.asm(code,addr=addr)
              return bytes(enc)
          def a4(x): return (x+3)&~3

          out=bytearray(src)
          tfix=B+len(out)
          tfix_code=asm('''
              ldrh r2, [r0, #0x1a]
              movw r3, #0x3030
              cmp r2, r3
              ite eq
              moveq r3, #1
              movne r3, #0
              adds r4, #0x16
              b.w 0x080097c4
          ''',tfix)
          out.extend(tfix_code)
          while len(out)%4: out.append(0)

          routefix=B+len(out)
          routefix_code=asm('''
              mov r0, r4
              ldrh r1, [r0, #4]
              movw r2, #0x3030
              cmp r1, r2
              bne not_packet00
              ldrb r3, [r0, #2]
              movw r2, #0x3d82
              movt r2, #0x2000
              movs r1, #0
              strb r1, [r2, r3]
              bl 0x0800b4e0
              pop {r4, pc}
          not_packet00:
              bx lr
          ''',routefix)
          out.extend(routefix_code)
          while len(out)%4: out.append(0)

          # Keep original GPRS state-machine hook at 0x97C0 intact. We only alter
          # the already-appended known-booting helper's fallthrough.
          out[0x10d04:0x10d08]=asm(f'b.w 0x{tfix:08x}',B+0x10d04)
          # Existing routing stub is replaced only by a branch to a larger safe stub.
          out[0x10dd4:0x10dd8]=asm(f'b.w 0x{routefix:08x}',B+0x10dd4)

          # Validation: original firmware range up through 0x10D03 remains byte-identical.
          assert out[:0x10d04] == src[:0x10d04]
          # Critical original-state-machine bytes remain untouched.
          assert out[0x96cc:0x9812] == src[0x96cc:0x9812]
          assert out[0x3be8:0x3bec] == src[0x3be8:0x3bec]   # IMEI60 live-loop wrapper hook retained
          assert out[0x3b0c:0x3b10] == src[0x3b0c:0x3b10]   # reset/init wrapper retained
          assert out[0x10c22:0x10c72] == src[0x10c22:0x10c72] # IMEI60 routine retained
          assert out[0x10ccc:0x10d04] == src[0x10ccc:0x10d04] # dual-route logic retained
          assert out[0x10dc4:0x10dd4] == src[0x10dc4:0x10dd4] # 5063/3030 duplicate exclusion retained

          # Disassemble patched transfer points.
          for addr,off in ((B+0x10d04,0x10d04),(B+0x10dd4,0x10dd4)):
              ins=list(md.disasm(bytes(out[off:off+4]),addr))[0]
              print(hex(addr),ins.mnemonic,ins.op_str)
              assert ins.mnemonic=='b.w'

          print('\nTFIX',hex(tfix),len(tfix_code))
          for i in md.disasm(tfix_code,tfix): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          print('\nROUTEFIX',hex(routefix),len(routefix_code))
          for i in md.disasm(routefix_code,routefix): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')

          name='MA_196-GE-AR_ME1_PACKET00_IP1_TREG_OK_EVENTOS_IP1_IP2_IMEI60_IP2_RESET24H_TEST4.bin'
          Path(name).write_bytes(out)
          print('\nBASE_SHA256',hashlib.sha256(src).hexdigest())
          print('OUT_SIZE',len(out))
          print('OUT_SHA256',hashlib.sha256(out).hexdigest())
          print('CHANGED_EXISTING_BYTES',[hex(i) for i in range(len(src)) if src[i]!=out[i]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MA196_COMBINED_SAFE_TEST4
          path: MA_196-GE-AR_ME1_PACKET00_IP1_TREG_OK_EVENTOS_IP1_IP2_IMEI60_IP2_RESET24H_TEST4.bin
          if-no-files-found: error
