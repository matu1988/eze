name: Map MA193 to Known-Booting MA196 Original-Range Diffs

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all diff ranges and possible image metadata
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          import struct
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          o=Path('MA_193-GE-AR.bin').read_bytes(); k=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          diffs=[i for i in range(len(o)) if o[i]!=k[i]]
          groups=[]
          if diffs:
            s=p=diffs[0]
            for x in diffs[1:]:
              if x==p+1:p=x
              else: groups.append((s,p+1));s=p=x
            groups.append((s,p+1))
          print('DIFF_COUNT',len(diffs),'GROUPS',len(groups))
          for a,b in groups:
            print('\nRANGE',hex(a),hex(b),'ADDR',hex(B+a),hex(B+b),'LEN',b-a)
            print('193  ',o[a:b].hex(' '))
            print('KNOWN',k[a:b].hex(' '))
            cs=max(0,a-12); ce=min(len(o),b+20)
            print('193 CONTEXT')
            for i in md.disasm(o[cs:ce],B+cs): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
            print('KNOWN CONTEXT')
            for i in md.disasm(k[cs:ce],B+cs): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          # Search 193 for literal references to original end address/file sizes and nearby values.
          for v in (len(o),B+len(o),len(k),B+len(k),0x10b24,0x8010b24):
            pat=struct.pack('<I',v); hits=[];p=0
            while True:
              q=o.find(pat,p)
              if q<0:break
              hits.append(hex(B+q));p=q+1
            print('VALUE_REFS_193',hex(v),hits)
          # Last 128 bytes compare.
          print('TAIL193',o[-128:].hex(' '))
          print('TAILKNOWN_AT_SAME',k[len(o)-128:len(o)].hex(' '))
          PY
