name: Decode Known-Booting MA196 GPRS Helpers

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode safe helper wrappers
        shell: bash
        run: |
          python -m pip install --quiet capstone
          python - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_THUMB,CS_MODE_LITTLE_ENDIAN
          B=0x08000000
          d=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin').read_bytes()
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN);md.skipdata=True
          for s,e,name in [
            (0x10b80,0x10c20,'HELPERS 10B80-10C20'),
            (0x10c20,0x10d20,'HELPERS 10C20-10D20'),
            (0x10d20,0x10de8,'HELPERS 10D20-END')]:
            print('\n###',name)
            for i in md.disasm(d[s:e],B+s): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          # Print exact bytes and entry contexts for known hooks.
          for off in (0x9736,0x9740,0x977a,0x97c0):
            print('\nHOOKCTX',hex(B+off),d[off-8:off+20].hex(' '))
          PY
