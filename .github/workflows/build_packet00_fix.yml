name: Build Packet00 Live Loop TREG V3

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Packet00 live-loop timer
        shell: bash
        run: |
          python -m pip install --quiet capstone keystone-engine
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from keystone import Ks, KS_ARCH_ARM, KS_MODE_THUMB, KS_MODE_LITTLE_ENDIAN
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN

          BASE=0x08000000
          SRC=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin')
          OUT=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_TREG_LIVELOOP_V3.bin')

          src=SRC.read_bytes()
          assert len(src)==69096, len(src)
          assert hashlib.sha256(src).hexdigest()=='c12fdc4a58fe4a1cfa13f8de3981ac267039d8ca72c292e9ec8245bbb1a31f76'
          d=bytearray(src)

          original_hook=bytes(d[0x10C1C:0x10C20])
          assert original_hook == bytes.fromhex('00 F0 01 F8')
          assert d[0x10CAA:0x10CAE] == bytes.fromhex('00 F0 93 F8')
          assert d[0x10DCC:0x10DD2] == bytes.fromhex('43 F2 30 02 91 42')

          ks=Ks(KS_ARCH_ARM, KS_MODE_THUMB|KS_MODE_LITTLE_ENDIAN)
          tick_off=len(d)
          tick_addr=BASE+tick_off

          hook,_=ks.asm(f'bl 0x{tick_addr:08x}', addr=BASE+0x10C1C, as_bytes=True)
          hook=bytes(hook)
          assert len(hook)==4 and hook != original_hook
          d[0x10C1C:0x10C20]=hook

          asm='''
              push {r4,lr}
              bl 0x08010c22
              bl 0x08010b3e
              cmp r0, #1
              bne disable_test

              bl 0x08007620
              mov r4, r0
              cbz r0, disable_test

              movw r2, #0x43b4
              movt r2, #0x2000
              ldr r1, [r2]
              movw r0, #0x5354
              movt r0, #0x3354
              cmp r1, r0
              beq state_ready
              str r0, [r2]
              movs r1, #0
              str r1, [r2, #4]

          state_ready:
              movw r0, #0x43b8
              movt r0, #0x2000
              mov r1, r4
              bl 0x08003e0c
              cbz r0, done

              movw r0, #0x3030
              movs r1, #0
              movs r2, #1
              bl 0x080082a8
              cbz r0, done

              movw r0, #0x43b8
              movt r0, #0x2000
              movs r1, #0
              str r1, [r0]
              b done

          disable_test:
              movw r0, #0x43b4
              movt r0, #0x2000
              movs r1, #0
              str r1, [r0]
              str r1, [r0, #4]

          done:
              pop {r4,pc}
          '''
          tick,_=ks.asm(asm, addr=tick_addr, as_bytes=True)
          tick=bytes(tick)
          d.extend(tick)
          OUT.write_bytes(d)

          diffs=[i for i,(a,b) in enumerate(zip(src,d)) if a!=b]
          assert diffs and all(0x10C1C <= x < 0x10C20 for x in diffs), [hex(x) for x in diffs]
          assert bytes(d[0x10C1C:0x10C20]) == hook
          assert d[0x10CAA:0x10CAE] == bytes.fromhex('00 F0 93 F8')
          assert d[0x10DCC:0x10DD2] == bytes.fromhex('43 F2 30 02 91 42')

          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          print('SOURCE_SIZE',len(src))
          print('OUTPUT_SIZE',len(d))
          print('ORIGINAL_HOOK',original_hook.hex(' '))
          print('NEW_HOOK',hook.hex(' '),'AT',hex(BASE+0x10C1C),'TICK_ADDR',hex(tick_addr))
          print('TICK_SIZE',len(tick))
          print('SHA256',hashlib.sha256(d).hexdigest())
          print('DIFFS_IN_SOURCE_RANGE',[hex(x) for x in diffs])
          print('--- wrapper context ---')
          for i in md.disasm(bytes(d[0x10C16:0x10C22]),BASE+0x10C16):
              print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          print('--- live-loop Packet00 tick ---')
          for i in md.disasm(tick,tick_addr):
              print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          PY

      - name: Commit firmware
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MA_196-GE-AR_PACKET00_SOLO_IP1_TREG_LIVELOOP_V3.bin
          git commit -m "Add Packet00 live-loop TREG V3" || true
          git push

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: MA_196_PACKET00_TREG_LIVELOOP_V3
          path: MA_196-GE-AR_PACKET00_SOLO_IP1_TREG_LIVELOOP_V3.bin
          if-no-files-found: error
