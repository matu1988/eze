name: Build Packet00 Boot-Safe Dual Path V6

on:
  push:
    paths:
      - '.github/workflows/build_packet00_fix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build boot-safe dual-path firmware
        shell: bash
        run: |
          python -m pip install --quiet capstone keystone-engine
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from keystone import Ks, KS_ARCH_ARM, KS_MODE_THUMB, KS_MODE_LITTLE_ENDIAN
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN

          BASE=0x08000000
          SRC=Path('MA_196-GE-AR_PACKET00_SOLO_IP1_RESTO_IP1_IP2.bin')
          OUT=Path('MA_196-GE-AR_PACKET00_IP1_TREG_BOOTSAFE_V6.bin')
          src=SRC.read_bytes()
          assert len(src)==69096, len(src)
          assert hashlib.sha256(src).hexdigest()=='c12fdc4a58fe4a1cfa13f8de3981ac267039d8ca72c292e9ec8245bbb1a31f76'
          d=bytearray(src)

          assert d[0x9714:0x9718] == bytes.fromhex('FF F7 E4 FA')
          assert d[0x9E6C:0x9E70] == bytes.fromhex('FE F7 38 FF')
          assert d[0x10C26:0x10C2A] == bytes.fromhex('FF F7 8A FF')
          assert d[0x10DE0:0x10DE4] == bytes.fromhex('FA F7 7E FB')

          ks=Ks(KS_ARCH_ARM, KS_MODE_THUMB|KS_MODE_LITTLE_ENDIAN)

          cache_off=len(d)
          cache_addr=BASE+cache_off
          cache_asm='''
              push {r1,r2,r3,lr}
              bl 0x08010b3e
              movw r1, #0x43bc
              movt r1, #0x2000
              strb r0, [r1]
              movw r2, #0x4d45
              str r2, [r1, #4]
              pop {r1,r2,r3,pc}
          '''
          cache,_=ks.asm(cache_asm, addr=cache_addr, as_bytes=True)
          cache=bytes(cache)
          d.extend(cache)
          if len(d)&1:
              d.append(0)

          hook,_=ks.asm(f'bl 0x{cache_addr:08x}', addr=BASE+0x10C26, as_bytes=True)
          hook=bytes(hook); assert len(hook)==4
          d[0x10C26:0x10C2A]=hook

          wrap_off=len(d)
          wrap_addr=BASE+wrap_off
          wrap_asm='''
              push {r3,r4,r5,r6,r7,lr}
              mov r4, r0
              mov r5, r1
              mov r6, r2
              mov r7, r3
              movw r2, #0x43bc
              movt r2, #0x2000
              ldr r0, [r2, #4]
              movw r1, #0x4d45
              cmp r0, r1
              bne original_path
              ldrb r0, [r2]
              cmp r0, #1
              bne original_path
              cmp r7, #0
              beq disable_test
              movw r2, #0x43b4
              movt r2, #0x2000
              ldr r1, [r2]
              movw r0, #0x5354
              movt r0, #0x3354
              cmp r1, r0
              beq state_ready
              str r0, [r2]
              movs r1, #0
              str r1, [r2, #4]
          state_ready:
              movw r0, #0x43b8
              movt r0, #0x2000
              mov r1, r7
              bl 0x08003e0c
              cbz r0, no_fire
              mov r0, r4
              mov r1, r5
              movw r2, #0x43b8
              movt r2, #0x2000
              mov r3, r7
              bl 0x08008ce0
              cbz r0, return_now
              mov r5, r0
              movw r0, #0x43b8
              movt r0, #0x2000
              movs r1, #0
              str r1, [r0]
              mov r0, r5
              b return_now
          no_fire:
              movs r0, #0
              b return_now
          original_path:
              mov r0, r4
              mov r1, r5
              mov r2, r6
              mov r3, r7
              bl 0x08008ce0
              b return_now
          disable_test:
              movw r0, #0x43b4
              movt r0, #0x2000
              movs r1, #0
              str r1, [r0]
              str r1, [r0, #4]
              movs r0, #0
          return_now:
              pop {r3,r4,r5,r6,r7,pc}
          '''
          wrapper,_=ks.asm(wrap_asm, addr=wrap_addr, as_bytes=True)
          wrapper=bytes(wrapper)
          d.extend(wrapper)

          for off in (0x9714,0x9E6C):
              h,_=ks.asm(f'bl 0x{wrap_addr:08x}', addr=BASE+off, as_bytes=True)
              h=bytes(h); assert len(h)==4
              d[off:off+4]=h

          d[0x10DE0:0x10DE4]=bytes.fromhex('00 20 00 BF')

          OUT.write_bytes(d)
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          print('SOURCE_SIZE',len(src))
          print('OUTPUT_SIZE',len(d))
          print('CACHE_ADDR',hex(cache_addr),'CACHE_SIZE',len(cache))
          print('WRAP_ADDR',hex(wrap_addr),'WRAP_SIZE',len(wrapper))
          print('SHA256',hashlib.sha256(d).hexdigest())
          print('IMEI_ME_HOOK',d[0x10C26:0x10C2A].hex(' '))
          print('HOOK_A',d[0x9714:0x9718].hex(' '))
          print('HOOK_B',d[0x9E6C:0x9E70].hex(' '))
          print('ROUTE_3030',d[0x10DE0:0x10DE4].hex(' '))
          print('--- CACHE ---')
          for i in md.disasm(cache,cache_addr): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          print('--- WRAPPER ---')
          for i in md.disasm(wrapper,wrap_addr): print(f'{i.address:08X}: {i.bytes.hex(" "):14} {i.mnemonic:8} {i.op_str}')
          PY

      - name: Commit firmware
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MA_196-GE-AR_PACKET00_IP1_TREG_BOOTSAFE_V6.bin
          git commit -m "Add boot-safe Packet00 dual-path V6" || true
          git push

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: MA_196_PACKET00_BOOTSAFE_V6
          path: MA_196-GE-AR_PACKET00_IP1_TREG_BOOTSAFE_V6.bin
          if-no-files-found: error
