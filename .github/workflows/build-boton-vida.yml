name: Build NanoSmart Boton Vida No Echo Final

on:
  push:
    branches: [boton-vida-640]

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boton-vida-640
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and test server
        working-directory: server-src/NanoSmartServer_Windows_v3.6_Rendimiento_Receptor
        shell: bash
        run: |
          npm ci --omit=dev
          node --check server.js
          node --check src/fcm.js
          npm test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile integrated app
        working-directory: android-src/source_package_v32
        run: gradle :app:assembleDebug --stacktrace

      - name: Package final no-echo test version
        shell: bash
        run: |
          mkdir -p deliverables
          cp android-src/source_package_v32/app/build/outputs/apk/debug/app-debug.apk deliverables/NanoSmart_Eventos_3.8.0_BotonVida_NOECHO-debug.apk
          (cd android-src && zip -qr ../deliverables/NanoSmart_Android_BotonVida_NOECHO_Source.zip source_package_v32 -x '*/build/*' '*/.gradle/*')
          (cd server-src && zip -qr ../deliverables/NanoSmart_Server_v3.6_BotonVida640_NOECHO_LISTO.zip NanoSmartServer_Windows_v3.6_Rendimiento_Receptor -x '*/data/*' '*/secrets/*' '*/server-startup-test.log')
          printf '%s\n' "Build OK Boton Vida NOECHO FINAL $(date -u +%Y-%m-%dT%H:%M:%SZ)" > deliverables/NOECHO_BUILD_OK.txt

      - name: Commit deliverables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deliverables/NanoSmart_Eventos_3.8.0_BotonVida_NOECHO-debug.apk \
                     deliverables/NanoSmart_Android_BotonVida_NOECHO_Source.zip \
                     deliverables/NanoSmart_Server_v3.6_BotonVida640_NOECHO_LISTO.zip \
                     deliverables/NOECHO_BUILD_OK.txt
          git commit -m "Build Botón Vida no-echo final deliverables" || true
          git push origin HEAD:boton-vida-640

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanosmart-boton-vida-noecho-final
          path: |
            deliverables/NanoSmart_Eventos_3.8.0_BotonVida_NOECHO-debug.apk
            deliverables/NanoSmart_Android_BotonVida_NOECHO_Source.zip
            deliverables/NanoSmart_Server_v3.6_BotonVida640_NOECHO_LISTO.zip
            deliverables/NOECHO_BUILD_OK.txt
          if-no-files-found: error
          retention-days: 14
