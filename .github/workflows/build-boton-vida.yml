name: Build NanoSmart Boton Vida GPS Fix

on:
  push:
    branches: [boton-vida-640]

permissions:
  contents: write

jobs:
  build-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boton-vida-640
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile integrated app
        working-directory: android-src/source_package_v32
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK and source
        shell: bash
        run: |
          mkdir -p deliverables
          cp android-src/source_package_v32/app/build/outputs/apk/debug/app-debug.apk deliverables/NanoSmart_Eventos_3.8.0_BotonVida_GPSFIX_FINAL-debug.apk
          (cd android-src && zip -qr ../deliverables/NanoSmart_Android_BotonVida_GPSFIX_FINAL_Source.zip source_package_v32 -x '*/build/*' '*/.gradle/*')
          printf '%s\n' "Build OK Boton Vida GPS FIX FINAL $(date -u +%Y-%m-%dT%H:%M:%SZ)" > deliverables/GPSFIX_FINAL_BUILD_OK.txt

      - name: Commit deliverables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deliverables/NanoSmart_Eventos_3.8.0_BotonVida_GPSFIX_FINAL-debug.apk \
                     deliverables/NanoSmart_Android_BotonVida_GPSFIX_FINAL_Source.zip \
                     deliverables/GPSFIX_FINAL_BUILD_OK.txt
          git commit -m "Build final Botón Vida GPS fix APK" || true
          git push origin HEAD:boton-vida-640

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanosmart-boton-vida-gpsfix-final
          path: |
            deliverables/NanoSmart_Eventos_3.8.0_BotonVida_GPSFIX_FINAL-debug.apk
            deliverables/NanoSmart_Android_BotonVida_GPSFIX_FINAL_Source.zip
            deliverables/GPSFIX_FINAL_BUILD_OK.txt
          if-no-files-found: error
          retention-days: 14
